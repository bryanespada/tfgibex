{% extends '../base/base.html' %}
{% block content %}

<!-- page content -->
<div class="right_col" role="main">
    <div class="">
        <!-- Breadcrumb Navigation -->
        <div class="page-title">
            <div class="title_left">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb" style="background: none; padding: 5px 0; margin: 0; font-size: 14px; display: flex; flex-wrap: nowrap;">
                        <li class="breadcrumb-item active" aria-current="page" style="color: #2A3F54; font-weight: 500;">Mercados</li>
                    </ol>
                </nav>
                <h3 style="margin-top: 10px;">Mercados</h3>
            </div>
        </div>

        <div class="clearfix"></div>

        <div class="row" style="display: block;">
            <div class="clearfix"></div>
            <div class="col-md-12 col-sm-12  ">

                <div class="x_panel">

                        <h2>Search mercados</h2>
                        <input type="text" class="form-control" id="filterInput" oninput="filterTable()"
                            placeholder="Search mercado..">
                        <div class="table-responsive mt-4">
                            <table id="mytable" class="table table-hover main-table">
                                <tbody>
                                    {% for mercado in mercados %}
                                    {# apps/ urls.py #}
                                    <tr>
                                        <td style="width: 50px;" data-url="{% url 'user_bolsas' mercado_id=mercado.id %}" onclick="redirect(this)">
                                            <i class="fa-solid fa-circle-arrow-right"></i>
                                        </td>
                                        <td data-url="{% url 'user_bolsas' mercado_id=mercado.id %}" onclick="redirect(this)">
                                                <b>{{mercado.title}}</b>
                                            <p>
                                                {{mercado.description|linebreaksbr}}
                                            </p>
                                        </td>      
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                        
                        <div id="noResultsMessage" class="mt-3 d-none">
                            <p class="warning">No results found.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- /page content -->

{% endblock %}
